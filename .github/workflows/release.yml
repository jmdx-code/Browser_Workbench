name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - run: npm run check
      - name: Set default public update source
        run: node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('config/update-source.json', JSON.stringify({githubRepo:process.env.GITHUB_REPOSITORY,autoCheck:true},null,2)+'\n')"
      - run: npm run build:release
      # A baseline installer is also needed for first installation / engine changes.
      - run: npm run package:win -- --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          files: |
            release/workbench-hot-update.zip
            release/release-manifest.json
            release/*.exe
          fail_on_unmatched_files: true
