name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use canonical Windows temporary paths
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - run: npm run check
      - name: Set default public update source
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('config/update-source.json', JSON.stringify({githubRepo:process.env.GITHUB_REPOSITORY,autoCheck:true},null,2)+'\n')"
      - run: npm run build:release
      # A baseline installer is also needed for first installation / engine changes.
      - run: npm run package:win -- --publish never
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          files: |
            release/workbench-hot-update.zip
            release/release-manifest.json
            release/*.exe
          fail_on_unmatched_files: true
