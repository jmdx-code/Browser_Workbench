<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>浏览器资料识别 · 工作台</title>
    <link rel="stylesheet" href="/browser-identify.css" />
    <script src="/browser-identify.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">浏览器工作台 · 资料识别</p>
      <h1 id="alias">当前浏览器</h1>
      <p>这个窗口属于你在软件中点击“显示”的那份浏览器资料。</p>
      <p class="number">资料编号 <code id="profile"></code></p>
      <div class="hint">
        需要更新插件时，在这份浏览器的扩展管理页刷新 Browser Workbench
        Bridge。此识别窗口可以直接关闭，不影响你的其他标签页。
      </div>
    </main>
  </body>
</html>
